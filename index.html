        img { max-width: 100%; max-height: 100%; object-fit: contain; }
        button { padding: 12px 24px; font-size: 18px; font-weight: bold; cursor: pointer; background-color: #bb86fc; color: #000; border: none; border-radius: 25px; transition: 0.3s; }
        button:hover { background-color: #9965f4; transform: scale(1.05); }
    </style>
</head>
