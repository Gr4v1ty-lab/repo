<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mems Gallery</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background-color: #121212; color: white; }
        .container { text-align: center; background: #1e1e1e; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 90%; }
        #image-wrapper { height: 400px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 20px; border-radius: 8px; background: #252525; }
        img { max-width: 100%; max-height: 100%; object-fit: contain; }
        button { padding: 12px 24px; font-size: 18px; font-weight: bold; cursor: pointer; background-color: #bb86fc; color: #000; border: none; border-radius: 25px; transition: 0.3s; }
        button:hover { background-color: #9965f4; transform: scale(1.05); }
    </style>
</head>
<body>

<div class="container">
    <h1>Random Meme</h1>
    <div id="image-wrapper">
        <img id="meme-display" src="" alt="Click to load a meme">
    </div>
    <button onclick="loadRandomMeme()">Next Meme</button>
</div>

<script>
    // These are the file IDs from your "Mems" folder
    const memeIds = [
        "1slMlXXNJDNJYx5c5jnlDDARSzxhtVhGI", // Folder ID/Main entry
        "1n3qa0Io_your_file_id_here",         // Placeholder for n3qa0Io.jpeg
        "1077gOGK_your_file_id_here",         // Placeholder for 077gOGK.jpeg
        "1AwXGLzv_your_file_id_here"          // Placeholder for AwXGLzv.jpeg
    ];

    function loadRandomMeme() {
        const imgElement = document.getElementById('meme-display');
        const randomIndex = Math.floor(Math.random() * memeIds.length);
        const selectedId = memeIds[randomIndex];
        
        // Show loading state
        imgElement.style.opacity = "0.5";
        
        // Direct link to view the image
        imgElement.src = `https://drive.google.com/uc?export=view&id=${selectedId}`;
        
        imgElement.onload = () => {
            imgElement.style.opacity = "1";
        };
    }

    // Load first image on startup
    window.onload = loadRandomMeme;
</script>

</body>
</html>
