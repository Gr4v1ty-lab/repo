<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mems Gallery</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
            background-color: #121212; 
            color: white; 
        }
        .container { 
            text-align: center; 
            background: #1e1e1e; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            max-width: 90%; 
            width: 600px;
        }
        #image-wrapper { 
            height: 450px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            margin-bottom: 20px; 
            border-radius: 8px; 
            background: #252525; 
            border: 1px solid #333;
        }
        img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            transition: opacity 0.3s ease-in-out;
        }
        button { 
            padding: 12px 30px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            background-color: #bb86fc; 
            color: #000; 
            border: none; 
            border-radius: 25px; 
            transition: 0.3s; 
            box-shadow: 0 4px 10px rgba(187, 134, 252, 0.3);
        }
        button:hover { 
            background-color: #9965f4; 
            transform: scale(1.05); 
        }
        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Random Meme</h1>
    <div id="image-wrapper">
        <img id="meme-display" src="" alt="Loading your meme...">
    </div>
    <button onclick="loadRandomMeme()">Next Meme</button>
</div>

    function loadRandomMeme() {
        const imgElement = document.getElementById('meme-display');
        const randomIndex = Math.floor(Math.random() * memeIds.length);
        const selectedId = memeIds[randomIndex];
        
        // Start fade out/loading effect
        imgElement.style.opacity = "0";
        
        // Using the thumbnail endpoint for better cross-site compatibility
        // sz=w1000 ensures we get a high-quality version
        imgElement.src = `https://drive.google.com/thumbnail?id=${selectedId}&sz=w1000`;
        
        // Only fade in once the image has actually loaded from Google's servers
        imgElement.onload = () => {
            imgElement.style.opacity = "1";
        };

        // Error handling if a link breaks
        imgElement.onerror = () => {
            console.error("Could not load image ID:", selectedId);
            loadRandomMeme(); // Try another one automatically
        };
    }

    // Load the first image when the page opens
    window.onload = loadRandomMeme;
</script>
